<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Elead chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/chat.css" />
  </head>
  <body>
    <main class="screen">
      <header class="chat-header">
        <div>
          <p id="chat-eyebrow" class="eyebrow">Line</p>
          <h1 id="chat-title" class="chat-title"></h1>
        </div>
        <div class="header-actions">
          <p id="chat-status" class="chat-status"></p>
          <button id="call-chat" class="button button-ghost" type="button">Call</button>
          <button id="approve-chat" class="button button-ghost" type="button" hidden>
            Approve
          </button>
        </div>
      </header>
      <p id="chat-empty" class="chat-empty" hidden>No messages yet. Write to start the conversation.</p>
      <div id="message-list" class="message-list"></div>
      <form id="compose-form" class="compose">
        <input
          id="compose-input"
          class="compose-input"
          name="message"
          type="text"
          autocomplete="off"
          placeholder="Write a message"
          required
        />
        <button class="button" type="submit">Send</button>
      </form>
    </main>
    <div id="fatal" class="fatal" hidden>
      <p class="eyebrow">Error</p>
      <h1 class="fatal-title">Chat could not continue.</h1>
      <p id="fatal-message" class="fatal-message"></p>
    </div>
    <script type="module" src="js/screens/chat.mjs?v=6"></script>
  </body>
</html>
